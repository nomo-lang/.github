name: Bug report
description: Report a reproducible problem in a Nomo project
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include security-sensitive details here. Follow SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Nomo version or revision
      description: Include the exact snapshot version, tag, or commit.
      placeholder: v0.0.0-20260720080715
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, target triple, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest source and exact commands that reproduce the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and RFCs.
          required: true
        - label: This report contains no credentials, private data, or undisclosed vulnerability details.
          required: true
